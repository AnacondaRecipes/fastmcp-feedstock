{% set name = "fastmcp" %}
{% set version = "3.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fastmcp-{{ version }}.tar.gz
  sha256: d8db60bfba3d20c5e327acb7992de6aaf45a5c368c887db709ade6d098646474

build:
  number: 0
  skip: true  # [py<310]
  script: cd fastmcp_slim && {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation && cd .. && {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - fastmcp = fastmcp.cli:app


requirements:
  host:
    - python
    - hatchling
    - uv-dynamic-versioning >=0.7.0
    - pip
  run:
    - python
    - platformdirs >=4.0.0
    - pydantic >=2.11.7
    - pydantic-settings >=2.0.0
    - python-dotenv >=1.1.0
    - rich >=13.9.4
    - typing_extensions >=4.0.0
    - exceptiongroup >=1.2.2
    - httpx >=0.28.1,<1.0
    - mcp >=1.24,<2.0
    - opentelemetry-api >=1.20.0
    - starlette >=0.27  # upstream >=1.0.1; pkgs/main max 0.52.1
    - authlib >=1.6.5  # upstream >=1.6.11; pkgs/main max 1.6.9
    - cyclopts >=4.0.0
    - griffelib >=2.0.0
    - jsonref >=1.1.0
    - jsonschema-path >=0.3.4
    - joserfc >=1.1.0
    - openapi-pydantic >=0.5.1
    - packaging >=24.0
    - pyperclip >=1.9.0
    - python-multipart >=0.0.26
    - pyyaml >=6.0,<7.0
    - uncalled-for >=0.2.0
    - uvicorn >=0.35
    - watchfiles >=1.0.0
    - websockets >=15.0.1
    - py-key-value-aio >=0.4.4,<0.5.0
    # py-key-value-aio[filetree]
    - aiofile
    - anyio
    # py-key-value-aio[memory]
    - cachetools
    # py-key-value-aio[keyring]
    - keyring
    # pydantic[email]
    - email-validator
  run_constrained:
    - anthropic >=0.48.0  # anthropic
    - prefab-ui >=0.18.0  # apps
    - azure-identity >=1.16.0  # azure
    - pyjwt >=2.12.0  # azure
    - pydantic-monty ==0.0.17  # code-mode
    - google-genai >=1.18.0  # gemini
    - openai >=1.102.0  # openai
    - pydocket >=0.18.0  # tasks; upstream >=0.20.0; pkgs/main max 0.18.2

{% set skip_tests = "" %}

# missing pytest-httpx/httpx_mock
{% set skip_tests = skip_tests + " --ignore=tests/server/auth/providers/test_http_client.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/server/auth/providers/test_introspection.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/server/auth/providers/test_clerk.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/server/auth/providers/test_google.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/server/auth/providers/test_workos.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/server/auth/test_jwt_provider.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/server/auth/test_cimd.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/client/test_openapi.py" %}
